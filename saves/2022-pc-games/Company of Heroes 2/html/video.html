<html>
<head>
<style>
video::-webkit-media-controls-fullscreen-button{display:none !important;}video{width:100%%;height:100%%;}body{margin:0px;}
</style>
<script type="text/javascript">
function getParameterByName(name, url) {
    if (!url) {
      url = window.location.href;
    }
    name = name.replace(/[\[\]]/g, "\\$&");
    var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
        results = regex.exec(url);
    if (!results) return null;
    if (!results[2]) return '';
    return decodeURIComponent(results[2].replace(/\+/g, " "));
}
</script>
</head>
<body style="margin: 0px;">
	<video id='video' src=''>
	<script type='text/javascript'>
		var video = document.getElementById('video');
		video.src = getParameterByName("src");
		video.addEventListener('ended',function(){alert('alert_ended');},false);
		video.addEventListener('play',function(){alert('alert_play');},false);
		video.addEventListener('pause',function(){alert('alert_pause');},false);
		video.addEventListener('loadeddata',function(){alert('alert_loadeddata');},false);
	</script>
</body>
</html>
